name: Secret history scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch historical pull request refs with read-only authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules origin '+refs/pull/*/head:refs/remotes/audit-pulls/*'
          printf 'Historical PR heads fetched: '
          git for-each-ref --format='%(refname)' refs/remotes/audit-pulls | wc -l
          printf 'Reachable commits: '
          git rev-list --all --count
      - name: Inventory historical sensitive file types and commit metadata
        run: |
          python3 - <<'PY'
          import collections
          import re
          import subprocess
          from pathlib import PurePosixPath

          raw = subprocess.check_output(["git", "log", "--all", "--full-history", "-m", "--format=", "--name-only", "-z"])
          paths = {p.strip().decode("utf-8", errors="replace") for p in raw.split(b"\0") if p.strip()}
          counts = collections.Counter()
          for path in paths:
              p = PurePosixPath(path)
              name = p.name.lower()
              if name == ".env" or (name.startswith(".env.") and name not in {".env.example", ".env.sample", ".env.template"}):
                  counts["environment files"] += 1
              if re.search(r"\.(pem|key|p12|pfx|kdbx)$", name):
                  counts["key or credential files"] += 1
              if re.search(r"\.(db|sqlite|sqlite3|dump|bak|sql\.gz|csv|xlsx|xls|vcf)$", name) or any(part.lower() in {"backups", "exports"} for part in p.parts[:-1]):
                  counts["database, backup or contact export candidates"] += 1
              if re.search(r"\.(png|jpe?g|webp|gif|pdf)$", name):
                  counts["image or document candidates"] += 1
              if any(part.lower() in {".vercel", ".cloudflare", ".claude"} for part in p.parts):
                  counts["local deployment or agent metadata"] += 1
          print("Distinct historical paths:", len(paths))
          for label in ("environment files", "key or credential files", "database, backup or contact export candidates", "image or document candidates", "local deployment or agent metadata"):
              print(label + ":", counts[label])
          metadata = subprocess.check_output(["git", "log", "--all", "--format=%ae%x09%ce"], text=True).splitlines()
          def non_noreply(email):
              return bool(email) and not (email.lower().endswith("@users.noreply.github.com") or email.lower() == "noreply@github.com")
          print("Commits with non-GitHub-noreply author or committer email:", sum(any(non_noreply(e) for e in line.split("\t")) for line in metadata))
          if any(counts.values()):
              print("::warning::Historical file candidates require private manual review.")
          PY
      - name: Install pinned Gitleaks release
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable Git history with redacted output
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all --full-history -m" .
